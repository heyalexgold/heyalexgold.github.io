<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>alex gold — blocks</title>
  <style>
    :root { --red: #e5392b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e8e8e8;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #111;
      min-height: 1200px;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- the block primitive ---------- */
    .block {
      position: absolute;
      background: #fff;
      touch-action: none;
      user-select: none;
      cursor: grab;
      z-index: 1;                 /* above the sliding red bar */
    }
    .block.dragging { cursor: grabbing; }

    /* the active-menu indicator: a red bar living in the left gutter, between
       the two black corner squares. z-index 0 so it slides UNDER the blocks. */
    #navbar {
      position: absolute;
      background: var(--red);
      z-index: 0;
      top: 0; height: 0;
    }

    .block > .content {
      position: absolute; inset: 0;
      padding: 16px 20px;
      overflow: hidden;
      font-size: 20px;
      line-height: 1.34;
      color: #111;
      overflow-wrap: normal;
      word-break: normal;
    }
    .block > .content.bare { padding: 0; }

    .block > .handle {
      position: absolute;
      width: 10px; height: 10px;   /* HANDLE — keep in sync with JS */
      background: #000;
    }
    .handle.tl { top: -10px; left: -10px; cursor: nwse-resize; }
    .handle.tr { top: -10px; right: -10px; cursor: nesw-resize; }
    .handle.bl { bottom: -10px; left: -10px; cursor: nesw-resize; }
    .handle.br { bottom: -10px; right: -10px; cursor: nwse-resize; }

    /* ---------- content variants ---------- */
    .block.nav > .content   { display: flex; align-items: center; font-size: 20px; line-height: 1.25; }

    .block.title > .content { display: flex; align-items: center; }
    .block.title h1 { font-size: 54px; font-weight: 500; letter-spacing: -0.01em; color: var(--red); }

    .block.sub > .content   { font-size: 16px; line-height: 1.22; }
    .block.sub .item + .item { margin-top: 9px; }

    .block.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 16%; display: block; }

    .block a, .block .accent { color: var(--red); text-decoration: none; }
    .block .sp { display: block; height: 0.9em; }   /* paragraph spacer */
  </style>
</head>
<body>

  <script>
  // ---------- block engine (shared primitive) ----------
  const HANDLE = 10;
  const MIN    = 40;
  const GAP    = HANDLE;   // neighbours rest a handle apart, so corner squares overlap exactly
  const SNAP   = 14;
  const CORNERS = ['tl', 'tr', 'bl', 'br'];
  let topZ = 1;

  const near = (v, c) => Math.abs(v - c) < SNAP;
  const snap = (v, cands) => { for (const c of cands) if (near(v, c)) return c; return v; };
  const overlap = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function handleRect(b, corner) {
    const left = corner.includes('l'), top = corner.includes('t');
    return {
      x: left ? b.x - HANDLE : b.x + b.w,
      y: top  ? b.y - HANDLE : b.y + b.h,
      w: HANDLE, h: HANDLE
    };
  }

  class Block {
    static all = [];

    constructor(x, y, w, h, opts = {}) {
      Object.assign(this, { x, y, w, h });
      this.nav = !!(opts.cls && opts.cls.split(' ').includes('nav'));
      this.el = document.createElement('div');
      this.el.className = 'block' + (opts.cls ? ' ' + opts.cls : '');
      this.content = document.createElement('div');
      this.content.className = 'content' + (opts.bare ? ' bare' : '');
      this.content.innerHTML = opts.html || '';
      this.el.appendChild(this.content);
      for (const c of CORNERS) {
        const hd = document.createElement('span');
        hd.className = 'handle ' + c;
        hd.dataset.corner = c;
        this.el.appendChild(hd);
      }
      this.el.addEventListener('pointerdown', e => this.onDown(e));
      document.body.appendChild(this.el);
      this.draw();
      Block.all.push(this);
    }

    draw() {
      const s = this.el.style;
      s.left = this.x + 'px'; s.top = this.y + 'px';
      s.width = this.w + 'px'; s.height = this.h + 'px';
      if (activeNav === this) placeBar(this, false);   // bar tracks the active item while it moves
    }

    overflowing() {
      const c = this.content;
      return c.scrollWidth > c.clientWidth + 1 || c.scrollHeight > c.clientHeight + 1;
    }

    others() { return Block.all.filter(b => b !== this); }
    hitsAny() { return this.others().some(b => this.hits(b)); }
    hits(o) {
      if (overlap(this, o)) return true;
      for (const c of CORNERS) {
        if (overlap(this, handleRect(o, c))) return true;
        if (overlap(o, handleRect(this, c))) return true;
      }
      return false;
    }

    onDown(e) {
      e.preventDefault();
      this.el.style.zIndex = ++topZ;
      const corner = e.target.dataset.corner || null;
      const s = { px: e.clientX, py: e.clientY, x: this.x, y: this.y, w: this.w, h: this.h };
      this.el.classList.add('dragging');
      this.el.setPointerCapture(e.pointerId);
      let moved = false;
      const move = ev => {
        const dx = ev.clientX - s.px, dy = ev.clientY - s.py;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        corner ? this.resize(s, corner, dx, dy) : this.move(s.x + dx, s.y + dy);
      };
      const up = () => {
        this.el.classList.remove('dragging');
        this.el.removeEventListener('pointermove', move);
        this.el.removeEventListener('pointerup', up);
        this.el.removeEventListener('pointercancel', up);
        if (!moved && this.nav) activateNav(this);      // a click (not a drag) selects the item
      };
      this.el.addEventListener('pointermove', move);
      this.el.addEventListener('pointerup', up);
      this.el.addEventListener('pointercancel', up);
    }

    move(nx, ny) {
      for (const b of this.others()) {
        nx = snap(nx, [b.x, b.x + b.w - this.w, b.x + b.w + GAP, b.x - this.w - GAP]);
        ny = snap(ny, [b.y, b.y + b.h - this.h, b.y + b.h + GAP, b.y - this.h - GAP]);
      }
      const ox = this.x; this.x = nx; if (this.hitsAny()) this.x = ox;
      const oy = this.y; this.y = ny; if (this.hitsAny()) this.y = oy;
      this.draw();
    }

    resize(s, corner, dx, dy) {
      const left = corner.includes('l'), top = corner.includes('t');
      let L = s.x, R = s.x + s.w, T = s.y, B = s.y + s.h;
      if (left) L = s.x + dx; else R = s.x + s.w + dx;
      if (top)  T = s.y + dy; else B = s.y + s.h + dy;
      for (const b of this.others()) {
        if (left) L = snap(L, [b.x, b.x + b.w + GAP]); else R = snap(R, [b.x + b.w, b.x - GAP]);
        if (top)  T = snap(T, [b.y, b.y + b.h + GAP]); else B = snap(B, [b.y + b.h, b.y - GAP]);
      }
      if (R - L < MIN) { if (left) L = R - MIN; else R = L + MIN; }
      if (B - T < MIN) { if (top)  T = B - MIN; else B = T + MIN; }
      const o = { x: this.x, y: this.y, w: this.w, h: this.h };
      this.x = L; this.w = R - L; if (this.hitsAny()) { this.x = o.x; this.w = o.w; }
      this.y = T; this.h = B - T; if (this.hitsAny()) { this.y = o.y; this.h = o.h; }
      this.draw();
      if (this.overflowing()) { Object.assign(this, o); this.draw(); }
    }
  }

  // ---------- the red active-menu bar (slides between items) ----------
  let activeNav = null;
  const bar = document.createElement('div');
  bar.id = 'navbar';
  document.body.appendChild(bar);

  // the bar lives in the left gutter (visible) and hides by sliding right, under
  // the white box (which is stacked above it).
  const barShown  = b => (b.x - HANDLE);   // left edge sitting in the gutter
  const barHidden = b => b.x;              // slid right, tucked under the white

  function placeBar(b, animate) {
    bar.style.width = HANDLE + 'px';
    if (!animate) {
      bar.style.transition = 'none';
      bar.style.left = barShown(b) + 'px';
      bar.style.top = b.y + 'px';
      bar.style.height = b.h + 'px';
      return;
    }
    const old = activeNav;
    clearTimeout(bar._t);
    // 1) slide right, hiding under the old box
    bar.style.transition = 'left 0.16s ease';
    bar.style.left = barHidden(old) + 'px';
    bar._t = setTimeout(() => {
      // 2) while hidden, jump to the new item
      bar.style.transition = 'none';
      bar.style.top = b.y + 'px';
      bar.style.height = b.h + 'px';
      bar.style.left = barHidden(b) + 'px';
      void bar.offsetWidth;                       // commit the instant move
      // 3) slide left, emerging from under the new box
      bar.style.transition = 'left 0.18s ease';
      bar.style.left = barShown(b) + 'px';
    }, 170);
  }
  function activateNav(b) {
    if (b === activeNav) return;
    placeBar(b, true);
    activeNav = b;
  }

  const sp = '<span class="sp"></span>';   // paragraph gap

  // ---------- the site, as blocks (positions mirror the mockup) ----------

  // sidebar
  new Block(40,  90, 226,  40);                                                  // empty header slot
  const home = new Block(40, 140, 156,  55, { cls: 'nav', html: 'home' });
  new Block(40, 205, 156,  94, { cls: 'nav', html: 'currently<br>working on' });
  new Block(40, 310, 156, 114, { cls: 'nav', html: 'wish I was<br>working<br>on&hellip;' });
  new Block(40, 434, 156,  68, { cls: 'nav', html: 'in the news?' });
  new Block(40, 513, 156,  79, { cls: 'nav', html: 'resume/<br>contact me' });
  new Block(40, 601, 156,  79, { cls: 'nav', html: 'creative<br>work' });

  // sub-menu peeking off "currently working on"
  new Block(206, 205, 167, 180, { cls: 'sub', html:
    '<div class="item">haptic audio<br>controller</div>' +
    '<div class="item">strava ghost<br>runners</div>' +
    '<div class="item">thermal printer<br>camera</div>' });

  // header cluster
  new Block(486, 91, 335, 104, { cls: 'title', html: '<h1>alex gold</h1>' });
  new Block(650, 205, 170, 112, { html: 'engineer<br>busy bee<br>under thinker' });
  new Block(831, 91, 176, 274, { cls: 'portrait', bare: true,
    html: '<img src="../images/profile.jpg" alt="alex gold">' });

  // about / main text
  new Block(384, 474, 623, 418, { html:
    'about:' + sp +
    'alex gold is a bay area based mechanical engineer who is currently working as a design engineer at <a href="#">Tesla</a>.' + sp +
    'alex has got a couple active side projects going on like <a href="#">this</a> and <a href="#">that</a> with interactive displays' + sp +
    'he recently thought about trash and got a roll of film developed' });

  // start with the bar on "home"
  activeNav = home;
  placeBar(home, false);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>alex gold — sub C (deal)</title>
  <style>
    :root { --red: #e5392b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e8e8e8;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #111;
      min-height: 1200px;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- the block primitive ---------- */
    .block {
      position: absolute;
      background: #fff;
      touch-action: none;
      user-select: none;
      cursor: grab;
      z-index: 1;                 /* above the sliding red bar */
    }
    .block.dragging { cursor: grabbing; }
    .block.locked { cursor: default; }
    .block.locked.nav { cursor: pointer; }            /* menu items are click-only */
    .block.locked > .handle { cursor: default; }

    /* the active-menu indicator: a red bar living in the left gutter, between
       the two black corner squares. z-index 0 so it slides UNDER the blocks. */
    #navbar {
      position: absolute;
      background: var(--red);
      z-index: 0;
      top: 0; height: 0;
    }

    .block > .content {
      position: absolute; inset: 0;
      padding: 16px 20px;
      overflow: hidden;
      font-size: 20px;
      line-height: 1.34;
      color: #111;
      overflow-wrap: normal;
      word-break: normal;
    }
    .block > .content.bare { padding: 0; }

    .block > .handle {
      position: absolute;
      width: 7px; height: 7px;     /* HANDLE — keep in sync with JS */
      background: #000;
    }
    .handle.tl { top: -7px; left: -7px; cursor: nwse-resize; }
    .handle.tr { top: -7px; right: -7px; cursor: nesw-resize; }
    .handle.bl { bottom: -7px; left: -7px; cursor: nesw-resize; }
    .handle.br { bottom: -7px; right: -7px; cursor: nwse-resize; }

    /* ---------- content variants ---------- */
    .block.nav > .content   { display: flex; align-items: center; padding: 10px 16px; font-size: 17px; line-height: 1.25; }

    .block.title > .content { display: flex; align-items: center; }
    .block.title h1 { font-size: 54px; font-weight: 500; letter-spacing: -0.01em; color: var(--red); }

    .block.sub > .content   { padding: 10px 14px; font-size: 16px; line-height: 1.22; }
    .block.sub .item + .item { margin-top: 9px; }

    .block.redcap { background: var(--red); }

    .block.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 16%; display: block; }

    .block a, .block .accent { color: var(--red); text-decoration: none; }
    .block .sp { display: block; height: 0.9em; }   /* paragraph spacer */
  </style>
</head>
<body>

  <script>
  // ---------- block engine (shared primitive) ----------
  const HANDLE = 7;
  const MIN    = 40;
  const GAP    = HANDLE;   // neighbours rest a handle apart, so corner squares overlap exactly
  const SNAP   = 7;        // snap threshold (px) — gentle
  const RANGE  = 100;      // only snap to blocks whose nearest edge is within this many px
  const CORNERS = ['tl', 'tr', 'bl', 'br'];
  let topZ = 1;

  const near = (v, c) => Math.abs(v - c) < SNAP;
  const snap = (v, cands) => { for (const c of cands) if (near(v, c)) return c; return v; };
  const overlap = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  // is block b close enough to a rect (x,y,w,h) to be a snap target?
  const nearRect = (x, y, w, h, b) => {
    const dx = Math.max(0, b.x - (x + w), x - (b.x + b.w));
    const dy = Math.max(0, b.y - (y + h), y - (b.y + b.h));
    return Math.hypot(dx, dy) < RANGE;
  };

  function handleRect(b, corner) {
    const left = corner.includes('l'), top = corner.includes('t');
    return {
      x: left ? b.x - HANDLE : b.x + b.w,
      y: top  ? b.y - HANDLE : b.y + b.h,
      w: HANDLE, h: HANDLE
    };
  }

  class Block {
    static all = [];

    constructor(x, y, w, h, opts = {}) {
      Object.assign(this, { x, y, w, h });
      this.nav = !!(opts.cls && opts.cls.split(' ').includes('nav'));
      this.onClick = opts.onClick || null;
      this.locked = !!opts.locked;                     // locked = not draggable/resizable
      this.el = document.createElement('div');
      this.el.className = 'block' + (opts.cls ? ' ' + opts.cls : '');
      this.content = document.createElement('div');
      this.content.className = 'content' + (opts.bare ? ' bare' : '');
      this.content.innerHTML = opts.html || '';
      this.el.appendChild(this.content);
      for (const c of CORNERS) {
        const hd = document.createElement('span');
        hd.className = 'handle ' + c;
        hd.dataset.corner = c;
        this.el.appendChild(hd);
      }
      this.el.addEventListener('pointerdown', e => this.onDown(e));
      document.body.appendChild(this.el);
      this.draw();
      Block.all.push(this);
    }

    draw() {
      const s = this.el.style;
      s.left = this.x + 'px'; s.top = this.y + 'px';
      s.width = this.w + 'px'; s.height = this.h + 'px';
      if (activeNav === this) placeBar(this, false);   // bar tracks the active item while it moves
    }

    overflowing() {
      const c = this.content;
      return c.scrollWidth > c.clientWidth + 1 || c.scrollHeight > c.clientHeight + 1;
    }

    others() { return Block.all.filter(b => b !== this); }
    hitsAny() { return this.others().some(b => this.hits(b)); }
    hits(o) {
      if (overlap(this, o)) return true;
      for (const c of CORNERS) {
        if (overlap(this, handleRect(o, c))) return true;
        if (overlap(o, handleRect(this, c))) return true;
      }
      return false;
    }

    onDown(e) {
      e.preventDefault();
      this.el.style.zIndex = ++topZ;
      const corner = e.target.dataset.corner || null;
      const s = { px: e.clientX, py: e.clientY, x: this.x, y: this.y, w: this.w, h: this.h };
      this.el.classList.add('dragging');
      this.el.setPointerCapture(e.pointerId);
      let moved = false;
      const move = ev => {
        const dx = ev.clientX - s.px, dy = ev.clientY - s.py;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        if (this.locked) return;                        // menu boxes: click only, no drag/resize
        corner ? this.resize(s, corner, dx, dy) : this.move(s.x + dx, s.y + dy);
      };
      const up = () => {
        this.el.classList.remove('dragging');
        this.el.removeEventListener('pointermove', move);
        this.el.removeEventListener('pointerup', up);
        this.el.removeEventListener('pointercancel', up);
        if (!moved) {                                   // a click (not a drag)
          if (this.nav) activateNav(this);
          if (this.onClick) this.onClick();
        }
      };
      this.el.addEventListener('pointermove', move);
      this.el.addEventListener('pointerup', up);
      this.el.addEventListener('pointercancel', up);
    }

    move(nx, ny) {
      for (const b of this.others()) {
        if (!nearRect(nx, ny, this.w, this.h, b)) continue;   // only snap to nearby blocks
        nx = snap(nx, [b.x, b.x + b.w - this.w, b.x + b.w + GAP, b.x - this.w - GAP]);
        ny = snap(ny, [b.y, b.y + b.h - this.h, b.y + b.h + GAP, b.y - this.h - GAP]);
      }
      const ox = this.x; this.x = nx; if (this.hitsAny()) this.x = ox;
      const oy = this.y; this.y = ny; if (this.hitsAny()) this.y = oy;
      this.draw();
    }

    resize(s, corner, dx, dy) {
      const left = corner.includes('l'), top = corner.includes('t');
      let L = s.x, R = s.x + s.w, T = s.y, B = s.y + s.h;
      if (left) L = s.x + dx; else R = s.x + s.w + dx;
      if (top)  T = s.y + dy; else B = s.y + s.h + dy;
      const cx = L, cy = T, cw = R - L, ch = B - T;           // candidate rect for proximity
      for (const b of this.others()) {
        if (!nearRect(cx, cy, cw, ch, b)) continue;           // only snap to nearby blocks
        if (left) L = snap(L, [b.x, b.x + b.w + GAP]); else R = snap(R, [b.x + b.w, b.x - GAP]);
        if (top)  T = snap(T, [b.y, b.y + b.h + GAP]); else B = snap(B, [b.y + b.h, b.y - GAP]);
      }
      if (R - L < MIN) { if (left) L = R - MIN; else R = L + MIN; }
      if (B - T < MIN) { if (top)  T = B - MIN; else B = T + MIN; }
      const o = { x: this.x, y: this.y, w: this.w, h: this.h };
      this.x = L; this.w = R - L; if (this.hitsAny()) { this.x = o.x; this.w = o.w; }
      this.y = T; this.h = B - T; if (this.hitsAny()) { this.y = o.y; this.h = o.h; }
      this.draw();
      if (this.overflowing()) { Object.assign(this, o); this.draw(); }
    }
  }

  // ---------- the red active-menu bar (slides between items) ----------
  let activeNav = null;
  const bar = document.createElement('div');
  bar.id = 'navbar';
  document.body.appendChild(bar);

  // the bar lives in the left gutter (visible) and hides by sliding right, under
  // the white box (which is stacked above it).
  const barShown  = b => (b.x - HANDLE);   // left edge sitting in the gutter
  const barHidden = b => b.x;              // slid right, tucked under the white

  function placeBar(b, animate) {
    bar.style.width = HANDLE + 'px';
    if (!animate) {
      bar.style.transition = 'none';
      bar.style.left = barShown(b) + 'px';
      bar.style.top = b.y + 'px';
      bar.style.height = b.h + 'px';
      return;
    }
    const old = activeNav;
    clearTimeout(bar._t);
    // 1) slide right, hiding under the old box
    bar.style.transition = 'left 0.16s ease';
    bar.style.left = barHidden(old) + 'px';
    bar._t = setTimeout(() => {
      // 2) while hidden, jump to the new item
      bar.style.transition = 'none';
      bar.style.top = b.y + 'px';
      bar.style.height = b.h + 'px';
      bar.style.left = barHidden(b) + 'px';
      void bar.offsetWidth;                       // commit the instant move
      // 3) slide left, emerging from under the new box
      bar.style.transition = 'left 0.18s ease';
      bar.style.left = barShown(b) + 'px';
    }, 170);
  }
  function activateNav(b) {
    if (b === activeNav) return;
    placeBar(b, true);
    activeNav = b;
  }

  const sp = '<span class="sp"></span>';   // paragraph gap

  // ---------- the site, as blocks (positions mirror the mockup) ----------

  // sidebar (menu items are locked — click only, no drag/resize)
  // boxes sized to fit their text; 7px gaps so corner squares overlap
  new Block(40,  40, 140, 24, { cls: 'redcap', locked: true });                  // red cap on top
  const home = new Block(40,  71, 140, 42, { cls: 'nav', locked: true, html: 'home' });
  const cwo  = new Block(40, 120, 140, 63, { cls: 'nav', locked: true, html: 'currently<br>working on' });
  new Block(40, 190, 140, 42, { cls: 'nav', locked: true, html: 'tesla' });
  new Block(40, 239, 140, 42, { cls: 'nav', locked: true, html: 'in the news?' });
  new Block(40, 288, 140, 63, { cls: 'nav', locked: true, html: 'resume/<br>contact me' });
  new Block(40, 358, 140, 63, { cls: 'nav', locked: true, html: 'creative<br>work' });

  // sub-menu — three independent cards, hidden until the parent is clicked
  const cards = [
    new Block(187, 120, 150, 60, { cls: 'sub', locked: true, html: 'haptic audio<br>controller' }),
    new Block(187, 187, 150, 60, { cls: 'sub', locked: true, html: 'strava ghost<br>runners' }),
    new Block(187, 254, 150, 60, { cls: 'sub', locked: true, html: 'thermal printer<br>camera' })
  ];

  // header cluster (title + main content stay movable/resizable)
  new Block(486, 91, 335, 104, { cls: 'title', html: '<h1>alex gold</h1>' });
  new Block(650, 205, 170, 112, { html: 'engineer<br>busy bee<br>under thinker' });
  new Block(831, 91, 176, 274, { cls: 'portrait', bare: true,
    html: '<img src="../images/profile.jpg" alt="alex gold">' });

  // about / main text
  new Block(384, 474, 623, 418, { html:
    'about:' + sp +
    'alex gold is a bay area based mechanical engineer who is currently working as a design engineer at <a href="#">Tesla</a>.' + sp +
    'alex has got a couple active side projects going on like <a href="#">this</a> and <a href="#">that</a> with interactive displays' + sp +
    'he recently thought about trash and got a roll of film developed' });

  // ----- sub-menu pop-up · MODE C -----
  // The top card slides + grows out from under the parent. Each card below then
  // slides STRAIGHT DOWN, emerging from under the card above it, once it's out.
  let subOpen = false;
  const setBox = (el, b) => {
    el.style.left = b.x + 'px'; el.style.top = b.y + 'px';
    el.style.width = b.w + 'px'; el.style.height = b.h + 'px';
  };
  const openBox = c => ({ x: c.x, y: c.y, w: c.w, h: c.h });
  const restBox = () => ({ x: cwo.x, y: cwo.y, w: cwo.w, h: cwo.h });   // hidden home: behind the parent
  const CARD_MOVE = 'left .17s cubic-bezier(.2,.7,.3,1), top .17s cubic-bezier(.2,.7,.3,1), width .17s cubic-bezier(.2,.7,.3,1), height .17s cubic-bezier(.2,.7,.3,1)';

  const jumpTo = (el, box) => { el.style.transition = 'none'; setBox(el, box); void el.offsetWidth; };
  const glideTo = (el, box) => { el.style.transition = CARD_MOVE; setBox(el, box); };

  function showTop() {                       // top card: slide + grow out from under the parent
    const el = cards[0].el;
    jumpTo(el, restBox()); glideTo(el, openBox(cards[0])); el.style.pointerEvents = '';
  }
  function showLower() {                      // the two below: start behind the top card, slide straight down together
    for (let i = 1; i < cards.length; i++) {
      const el = cards[i].el;
      jumpTo(el, openBox(cards[0])); glideTo(el, openBox(cards[i])); el.style.pointerEvents = '';
    }
  }
  function hideLower() {                     // the two below: slide straight up, back behind the top card
    for (let i = 1; i < cards.length; i++) {
      const el = cards[i].el;
      glideTo(el, openBox(cards[0])); el.style.pointerEvents = 'none';
    }
  }
  function hideTop() {                        // top card retracts under the parent; lowers tuck home behind it
    glideTo(cards[0].el, restBox()); cards[0].el.style.pointerEvents = 'none';
    for (let i = 1; i < cards.length; i++) jumpTo(cards[i].el, restBox());
  }
  function openSub() {
    if (subOpen) return; subOpen = true;
    showTop();
    setTimeout(() => { if (subOpen) showLower(); }, 160);      // once the top is out
  }
  function closeSub() {                       // the exact reverse of openSub
    if (!subOpen) return; subOpen = false;
    hideLower();
    setTimeout(() => { if (!subOpen) hideTop(); }, 160);       // once the lowers are back up
  }

  // all cards start hidden behind the parent (nothing shows until it's clicked)
  cards.forEach((c, i) => { c.el.style.zIndex = -i; jumpTo(c.el, restBox()); c.el.style.pointerEvents = 'none'; });
  cwo.onClick = () => subOpen ? closeSub() : openSub();
  document.addEventListener('pointerdown', e => {
    if (subOpen && !cwo.el.contains(e.target) && !cards.some(c => c.el.contains(e.target))) closeSub();
  });

  // start with the bar on "home"
  activeNav = home;
  placeBar(home, false);
  </script>
</body>
</html>
